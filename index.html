<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreatheFree - Legal & Support</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #10b981;
      --card-bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --text: #f0f0f0;
        --muted: #9ca3af;
        --border: #2d2d2d;
        --accent: #34d399;
        --card-bg: #1a1a1a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1.2rem;
      max-width: 760px;
      margin: 0 auto;
    }
    h1 { font-size: 1.9rem; margin-bottom: 0.4rem; }
    p { color: var(--muted); margin-bottom: 1rem; }
    .grid {
      display: grid;
      gap: 0.9rem;
      margin-top: 1.2rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color 0.2s ease;
    }
    .card:hover {
      border-color: var(--accent);
    }
    .card strong {
      color: var(--text);
      display: block;
      margin-bottom: 0.25rem;
    }
    .small {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>BreatheFree</h1>
  <p>Official legal and support pages for App Store submission and user support.</p>

  <div class="grid">
    <a class="card" href="privacy-policy.html">
      <strong>Privacy Policy</strong>
      Data handling, local storage, and iCloud sync policy.
    </a>
    <a class="card" href="support.html">
      <strong>Support</strong>
      Frequently asked questions, troubleshooting, and contact email.
    </a>
  </div>

  <p class="small">© 2026 BreatheFree</p>
</body>
</html>
